<!doctype html><meta charset="utf-8"><title>ROM dialog verification</title><style>body{margin:0;background:#101c21}#view{position:relative;width:960px;height:640px;background:linear-gradient(#55756a,#192923)}#label{position:absolute;top:28px;left:28px;color:#dce6df;font:16px system-ui}</style><div id="view"><div id="label">source-driven dialog inspection</div></div><script type="module">import{createGbaCore}from'../../runtime-core/browser-core.mjs';import{readFireRedState}from'../../runtime-core/firered-state.mjs';import{createDialogOverlay}from'../../app/dialog.js';const core=await createGbaCore(new Uint8Array(await(await fetch('/rom')).arrayBuffer()));const overlay=createDialogOverlay(document.querySelector('#view'));window.loadFixture=async name=>{core.loadState(new Uint8Array(await(await fetch('./'+name+'.state')).arrayBuffer()));core.step(1,0);const report=overlay.update(core,readFireRedState(core));document.querySelector('#label').textContent=name+' · source frame '+core.frame;return report;};window.ready=true;</script>
